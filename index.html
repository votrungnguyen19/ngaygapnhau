<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Số Ngày Bên Nhau 💕</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --pink: #ff6b9d;
      --pink-light: #ffb3c9;
      --purple: #c77dff;
      --cream: #fff8f5;
      --soft-bg: #fff0f5;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Quicksand', sans-serif;
      background: linear-gradient(135deg, #fff0f5 0%, #ffe4ec 40%, #fce4ff 100%);
      min-height: 100vh;
      color: #4a2c3a;
      overflow-x: hidden;
      position: relative;
    }

    .hearts {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .heart {
      position: absolute;
      font-size: 18px;
      opacity: 0.15;
      animation: float 12s linear infinite;
    }

    @keyframes float {
      0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
      10% { opacity: 0.2; }
      90% { opacity: 0.15; }
      100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 20px 80px;
    }

    header {
      text-align: center;
      margin-bottom: 50px;
      animation: fadeInDown 1s ease;
    }

    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.2rem, 5vw, 3.4rem);
      font-weight: 700;
      background: linear-gradient(120deg, #ff6b9d, #c77dff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 12px;
      letter-spacing: 1px;
    }

    header .subtitle {
      font-size: 1.15rem;
      color: #8a5a6e;
      font-weight: 500;
    }

    .counter-card {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(16px);
      border-radius: 28px;
      padding: 40px 30px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(255, 107, 157, 0.18);
      border: 1px solid rgba(255, 182, 193, 0.4);
      margin-bottom: 50px;
      animation: fadeInUp 1s ease 0.2s both;
    }

    .counter-label {
      font-size: 1.1rem;
      color: #9b6b7c;
      margin-bottom: 18px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-weight: 600;
    }

    .days-number {
      font-family: 'Playfair Display', serif;
      font-size: clamp(4rem, 12vw, 6.5rem);
      font-weight: 700;
      background: linear-gradient(135deg, #ff6b9d 0%, #c77dff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      margin-bottom: 10px;
    }

    .days-text {
      font-size: 1.4rem;
      color: #6b3a4e;
      font-weight: 600;
      margin-bottom: 20px;
    }

    .start-date {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(90deg, #ffe4ec, #f8e1ff);
      padding: 10px 22px;
      border-radius: 50px;
      font-size: 0.95rem;
      color: #7a4a5c;
      font-weight: 500;
    }

    .start-date span {
      font-weight: 700;
      color: #c44d7a;
    }

    .gallery-section {
      animation: fadeInUp 1s ease 0.4s both;
    }

    .gallery-title {
      text-align: center;
      font-family: 'Playfair Display', serif;
      font-size: 1.9rem;
      color: #5c3a4a;
      margin-bottom: 30px;
      position: relative;
    }

    .gallery-title::after {
      content: '';
      display: block;
      width: 60px;
      height: 3px;
      background: linear-gradient(90deg, #ff6b9d, #c77dff);
      margin: 12px auto 0;
      border-radius: 3px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 22px;
    }

    .photo-card {
      position: relative;
      border-radius: 20px;
      overflow: hidden;
      aspect-ratio: 3/4;
      box-shadow: 0 12px 30px rgba(180, 80, 120, 0.15);
      transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
      cursor: pointer;
      background: #fff;
    }

    .photo-card:hover {
      transform: translateY(-10px) scale(1.02);
      box-shadow: 0 20px 45px rgba(180, 80, 120, 0.25);
    }

    .photo-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.5s ease;
    }

    .photo-card:hover img {
      transform: scale(1.08);
    }

    .photo-card::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(80, 30, 50, 0.35) 0%, transparent 50%);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .photo-card:hover::after {
      opacity: 1;
    }

    footer {
      text-align: center;
      margin-top: 60px;
      color: #a07080;
      font-size: 0.95rem;
      animation: fadeIn 1.5s ease 0.6s both;
    }

    footer .heart-icon {
      color: #ff6b9d;
      animation: heartbeat 1.5s ease infinite;
      display: inline-block;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(30, 10, 20, 0.92);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 20px;
      cursor: zoom-out;
    }

    .lightbox.active {
      display: flex;
    }

    .lightbox img {
      max-width: 95%;
      max-height: 90vh;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      object-fit: contain;
    }
  </style>
</head>
<body>
  <div class="hearts" id="hearts"></div>

  <div class="container">
    <header>
      <h1>💕 Số Ngày Bên Nhau 💕</h1>
      <p class="subtitle">Mỗi ngày bên nhau là một món quà</p>
    </header>

    <div class="counter-card">
      <div class="counter-label">Chúng ta đã bên nhau</div>
      <div class="days-number" id="days">0</div>
      <div class="days-text">ngày yêu thương</div>
      <div class="start-date">
        📅 Bắt đầu từ <span>24/10/2022</span>
      </div>
    </div>

    <section class="gallery-section">
      <h2 class="gallery-title">Khoảnh khắc đẹp của chúng ta</h2>
      <div class="gallery">
        <div class="photo-card">
          <img src="image.png" alt="Ảnh 1" loading="lazy" onclick="openLightbox(this)">
        </div>
        <div class="photo-card">
          <img src="1789745033028_557364471116092320_1019283567368028985_46eef974aea58ca3dab2f160599db6a9.jpg" alt="Ảnh 2" loading="lazy" onclick="openLightbox(this)">
        </div>
        <div class="photo-card">
          <img src="1789745033044_557364471116092320_1019283567368028985_7f2415ca94fb1b78bbbfeaf10c35e3c5.jpg" alt="Ảnh 3" loading="lazy" onclick="openLightbox(this)">
        </div>
        <div class="photo-card">
          <img src="1789745033058_557364471116092320_1019283567368028985_a28aaa68126c5add6ca4242bf90b548e.jpg" alt="Ảnh 4" loading="lazy" onclick="openLightbox(this)">
        </div>
        <div class="photo-card">
          <img src="1789745033070_557364471116092320_1019283567368028985_0830740aad0bff44ffb5b87fed39624d.jpg" alt="Ảnh 5" loading="lazy" onclick="openLightbox(this)">
        </div>
        <div class="photo-card">
          <img src="1789745033091_557364471116092320_1019283567368028985_80460d00081c81dd0dcb6c2612c6dfa1.jpg" alt="Ảnh 6" loading="lazy" onclick="openLightbox(this)">
        </div>
        <div class="photo-card">
          <img src="1789745033081_557364471116092320_1019283567368028985_7915733ffbf9ee858f0408c6bbb4fa81.jpg" alt="Ảnh 7" loading="lazy" onclick="openLightbox(this)">
        </div>
        <div class="photo-card">
          <img src="1789745033099_557364471116092320_1019283567368028985_abbde61e6af1f4578cfafe45362fab3a.jpg" alt="Ảnh 8" loading="lazy" onclick="openLightbox(this)">
        </div>
      </div>
    </section>

    <footer>
      <p>Yêu thương mãi mãi <span class="heart-icon">❤️</span></p>
    </footer>
  </div>

  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <img id="lightbox-img" src="" alt="Xem ảnh">
  </div>

  <script>
    const startDate = new Date(2022, 9, 24);

    function updateCounter() {
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const start = new Date(startDate.getFullYear(), startDate.getMonth(), startDate.getDate());
      
      const diffTime = today - start;
      const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
      
      document.getElementById('days').textContent = diffDays.toLocaleString('vi-VN');
    }

    updateCounter();
    setInterval(updateCounter, 60000);

    function createHearts() {
      const container = document.getElementById('hearts');
      const heartEmojis = ['💕', '💗', '💖', '💓', '❤️', '🩷'];
      
      for (let i = 0; i < 18; i++) {
        const heart = document.createElement('div');
        heart.className = 'heart';
        heart.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
        heart.style.left = Math.random() * 100 + '%';
        heart.style.animationDuration = (10 + Math.random() * 10) + 's';
        heart.style.animationDelay = Math.random() * 8 + 's';
        heart.style.fontSize = (14 + Math.random() * 16) + 'px';
        container.appendChild(heart);
      }
    }
    createHearts();

    function openLightbox(img) {
      const lb = document.getElementById('lightbox');
      const lbImg = document.getElementById('lightbox-img');
      lbImg.src = img.src;
      lb.classList.add('active');
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('active');
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeLightbox();
    });
  </script>
</body>
</html>
